<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <div class="mermaid">
        flowchart TD
            Sender[Sender] --> HTTP[HTTP Layer]
            HTTP --> Queue[Queue]
            Queue --> Worker[Worker Pool]
            Worker --> Success[Success Path]
            Worker --> Failure[Failure Path]
            Success --> Processed[Processed Store]
            Failure --> Retry[Retry Logic]
            Retry --> Worker
            Retry --> DeadLetter[Dead-letter List]
    </div>
    <script>
        mermaid.initialize({ startOnLoad: true });
    </script>
</body>
</html>
